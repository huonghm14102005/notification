name: notification-server

x-app-environment: &app-environment
  DATABASE_URL: postgresql://notify:${POSTGRES_PASSWORD:-notify-local}@postgres:5432/notification
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-Information}
  HEALTH_CHECK_TIMEOUT_SECONDS: 3
  JWT_SECRET: ${JWT_SECRET:-local-test-secret-at-least-32-bytes-long}
  JWT_ISSUER: notification-server
  JWT_AUDIENCE: notification-admin
  JWT_EXPIRES_IN: 3600
  JWT_REFRESH_EXPIRES_IN: 604800
  API_KEY_SALT: ${API_KEY_SALT:-local-api-key-salt-at-least-16-bytes}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-30000}

services:
  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: notification-server:${IMAGE_TAG:-local}
    command: ["migrate"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: notification-server:${IMAGE_TAG:-local}
    command: ["api"]
    environment:
      <<: *app-environment
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      SEED_TEST_ADMIN: "true"
      TRUSTED_CA_FILE: /run/test-ca/greenmail.crt
    volumes:
      - ./greenmail.crt:/run/test-ca/greenmail.crt:ro
    ports:
      - "${API_PORT:-3100}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      greenmail:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    image: notification-server:${IMAGE_TAG:-local}
    command: ["worker"]
    environment:
      <<: *app-environment
      WORKER_HEALTH_INTERVAL_SECONDS: 10
      WORKER_HEALTH_FILE: /tmp/notification-worker-health
      DELIVERY_POLL_INTERVAL_MS: ${DELIVERY_POLL_INTERVAL_MS:-500}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      TRUSTED_CA_FILE: /run/test-ca/greenmail.crt
    volumes:
      - ./greenmail.crt:/run/test-ca/greenmail.crt:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      greenmail:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/notification-worker-health"]
      interval: 15s
      timeout: 3s
      retries: 1

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notify-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notification"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - notification-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  greenmail:
    image: greenmail/standalone:2.1.11
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo $$GREENMAIL_PFX_BASE64 | base64 -d > /tmp/greenmail.p12 && exec /home/greenmail/run_greenmail.sh"]
    environment:
      GREENMAIL_PFX_BASE64: ""
      GREENMAIL_OPTS: "-Dgreenmail.smtp.hostname=0.0.0.0 -Dgreenmail.smtp.port=3025 -Dgreenmail.smtps.hostname=0.0.0.0 -Dgreenmail.smtps.port=3465 -Dgreenmail.api.port=8080 -Dgreenmail.users=mailer:secret@local.test,recipient:secret@local.test -Dgreenmail.tls.keystore.file=/tmp/greenmail.p12 -Dgreenmail.tls.keystore.password=changeit -Dgreenmail.tls.key.password=changeit"

volumes:
  notification-postgres:
