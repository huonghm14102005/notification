name: notification-server

x-app-environment: &app-environment
  DATABASE_URL: postgresql://notify:${POSTGRES_PASSWORD:-notify-local}@postgres:5432/notification
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-Information}
  HEALTH_CHECK_TIMEOUT_SECONDS: 3

services:
  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: notification-server:${IMAGE_TAG:-local}
    command: ["migrate"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: notification-server:${IMAGE_TAG:-local}
    command: ["api"]
    environment:
      <<: *app-environment
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      SEED_TEST_ADMIN: "true"
    ports:
      - "${API_PORT:-3100}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    image: notification-server:${IMAGE_TAG:-local}
    command: ["worker"]
    environment:
      <<: *app-environment
      WORKER_HEALTH_INTERVAL_SECONDS: 10
      WORKER_HEALTH_FILE: /tmp/notification-worker-health
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/notification-worker-health"]
      interval: 15s
      timeout: 3s
      retries: 1

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notify-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notification"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - notification-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  notification-postgres:
